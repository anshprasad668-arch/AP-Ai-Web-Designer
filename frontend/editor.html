<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1b"><title>Website Editor · AP AI Website Maker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#0e172b;--line:#293750;--muted:#9aa8c0;--blue:#7893ff}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:#f4f6ff;font:13px 'DM Sans',sans-serif}button,select,input{font:inherit}.bar{z-index:5;display:flex;align-items:center;gap:8px;min-height:58px;padding:8px 12px;border-bottom:1px solid #ffffff18;background:#0c1426}.bar h1{font:600 14px 'Space Grotesk';margin:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}.sp{flex:1}.btn{border:1px solid #ffffff22;background:#16233b;color:#f4f6ff;border-radius:8px;padding:9px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover:not(:disabled){background:#24375a}.btn:disabled{opacity:.4;cursor:default}.btn.pri{background:#7893ff;border-color:#7893ff;font-weight:700}.btn.on{border-color:#7893ff;background:#243764}.btn.danger{color:#ff9b9b}#status{color:var(--muted);font-size:11px;white-space:nowrap}.menu-wrap{position:relative}.menu{display:none;position:absolute;right:0;top:calc(100% + 9px);width:230px;padding:7px;background:#111d33;border:1px solid #354565;border-radius:12px;box-shadow:0 18px 55px #0009;z-index:20}.menu.open{display:block}.menu button,.menu a{display:flex;width:100%;padding:11px 10px;border:0;border-radius:7px;background:transparent;color:#e9edfa;text-decoration:none;text-align:left;cursor:pointer;font-size:12px}.menu button:hover,.menu a:hover{background:#253653}.menu .sep{height:1px;background:#ffffff18;margin:5px}.work{flex:1;display:flex;min-height:0;position:relative}#panel{width:300px;flex:none;overflow:auto;padding:15px;border-right:1px solid #ffffff18;background:var(--panel);transition:width .2s,padding .2s}#panel.collapsed{width:0;padding-left:0;padding-right:0;overflow:hidden;border:0}#panel h4{margin:18px 0 8px;font:600 13px 'Space Grotesk';color:#a9baff}#panel h4:first-child{margin-top:0}#panel label{display:block;margin:8px 0;color:var(--muted);font-size:12px}#panel input:not([type=color]),#panel select{width:100%;margin-top:4px;padding:9px;border-radius:7px;border:1px solid var(--line);background:#0a1222;color:#f4f6ff}#panel input[type=color]{display:block;width:100%;height:34px;margin-top:4px;border:1px solid var(--line);border-radius:7px;background:#0a1222;padding:2px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.btns .btn{flex:1 1 auto}.hint{color:#9aa8c0;font-size:12px;line-height:1.6}.stage{flex:1;min-width:0;overflow:auto;display:flex;justify-content:center;align-items:stretch;background:#050914;padding:10px}#frame{width:100%;height:100%;min-height:100%;border:0;border-radius:9px;background:#fff;transition:width .2s;box-shadow:0 10px 35px #0005}.stage.full{padding:0}.stage.full #frame{border-radius:0}.stage.fullscreen{position:fixed;inset:0;z-index:30;padding:0}.stage.fullscreen #frame{border-radius:0}.device-tools{display:flex;gap:5px}.mobile-panel-toggle{display:none}.bar .hide-small{display:inline-flex}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#203454;border:1px solid #536b9b;border-radius:9px;z-index:60;display:none}.toast.show{display:block}
@media(max-width:850px){.bar{gap:5px;min-height:54px;padding:7px}.bar h1{max-width:115px;font-size:12px}.btn{padding:8px 9px;font-size:11px}.device-tools .btn{padding:8px 7px}#status{display:none}#panel{position:absolute;z-index:4;left:0;top:0;bottom:0;width:min(88vw,330px);box-shadow:15px 0 35px #0007}#panel.collapsed{width:0}.mobile-panel-toggle{display:inline-flex}.stage{padding:6px}.stage.full{padding:0}}
@media(max-width:520px){.bar h1{display:none}.bar .hide-small{display:none}.device-tools{gap:3px}.device-tools .btn{font-size:10px;padding:8px 6px}.bar{min-height:52px}.bar .sp{min-width:3px}.btn{border-radius:7px}.stage{padding:0}#frame{border-radius:0}}
</style></head><body>
<header class="bar">
<a class="btn" id="back" href="/" aria-label="Back to dashboard">← <span class="hide-small">Back</span></a>
<button class="btn mobile-panel-toggle" id="panelToggle" aria-label="Toggle editing panel">☰</button>
<h1 id="title">Loading website…</h1>
<select id="pages" class="btn" aria-label="Choose page"></select>
<div class="device-tools"><button class="btn on" data-w="100%">Desktop</button><button class="btn" data-w="768px">Tablet</button><button class="btn" data-w="390px">Mobile</button></div>
<span class="sp"></span><span id="status" aria-live="polite">Loading…</span>
<button class="btn hide-small" id="undo" disabled title="Undo">↶</button><button class="btn hide-small" id="redo" disabled title="Redo">↷</button>
<button class="btn pri" id="save">Save</button>
<div class="menu-wrap"><button class="btn" id="menuButton" aria-label="More options" aria-expanded="false">⋮</button><div class="menu" id="moreMenu">
<button id="togglePanelMenu">✎ Edit website</button><button id="fullPreview">⛶ Full-screen preview</button><button id="exitFullPreview" hidden>▣ Exit full-screen preview</button><button id="copyPreview">⧉ Copy preview address</button><div class="sep"></div><a href="https://github.com/new" target="_blank" rel="noopener">↗ GitHub — create repository / upload site</a><button id="githubHelp">ⓘ How to publish with GitHub Pages</button><button id="showStructure">▤ View project file structure</button><div class="sep"></div><button id="downloadMenu">⇩ Download website ZIP</button>
</div></div>
</header>
<div class="work"><aside id="panel"></aside><div class="stage" id="stage"><iframe id="frame" title="Live website preview"></iframe></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="editor.js"></script></body></html>
