<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor · AP AI Website Maker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#080d1b;color:#f4f6ff;font:13px 'DM Sans',sans-serif}
button,select,input{font:inherit}
.bar{display:flex;align-items:center;gap:8px;padding:0 14px;height:54px;border-bottom:1px solid #ffffff18;background:#0c1426;flex-wrap:nowrap;overflow-x:auto}
.bar h1{font:600 15px 'Space Grotesk';margin:0 6px;white-space:nowrap}
.sp{flex:1}
.btn{border:1px solid #ffffff22;background:#16233b;color:#f4f6ff;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:#1f3050}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:#7893ff;border-color:#7893ff;font-weight:600}.btn.on{border-color:#7893ff;background:#243764}
.btn.danger{color:#ff9b9b}
#status{color:#9aa8c0;min-width:110px;text-align:right;font-size:12px}
.work{flex:1;display:flex;min-height:0}
#panel{width:300px;flex:none;overflow-y:auto;padding:14px;border-right:1px solid #ffffff18;background:#0e172b}
#panel h4{margin:18px 0 8px;font:600 13px 'Space Grotesk';color:#a9baff}#panel h4:first-child{margin-top:0}
#panel label{display:block;margin:8px 0;color:#9aa8c0;font-size:12px}
#panel input:not([type=color]),#panel select{width:100%;margin-top:4px;padding:7px 9px;border-radius:7px;border:1px solid #293750;background:#0a1222;color:#f4f6ff}
#panel input[type=color]{display:block;width:100%;height:32px;margin-top:4px;border:1px solid #293750;border-radius:7px;background:#0a1222;padding:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.btns .btn{flex:1 1 auto}
.hint{color:#7d8ba5;font-size:12px;line-height:1.5}
.stage{flex:1;overflow:auto;display:flex;justify-content:center;background:#050914;padding:14px}
#frame{width:100%;height:100%;border:0;border-radius:10px;background:#fff;transition:width .25s}
@media(max-width:800px){.work{flex-direction:column}#panel{width:100%;height:38%;border-right:0;border-bottom:1px solid #ffffff18}}
</style></head><body>
<div class="bar">
  <a class="btn" id="back" href="/">← Back</a><h1 id="title">Loading…</h1>
  <select id="pages" class="btn" aria-label="Page"></select>
  <button class="btn" id="undo" disabled>↶ Undo</button><button class="btn" id="redo" disabled>↷ Redo</button>
  <span class="sp"></span>
  <button class="btn on" data-w="100%">Desktop</button><button class="btn" data-w="768px">Tablet</button><button class="btn" data-w="390px">Mobile</button>
  <span id="status"></span>
  <button class="btn pri" id="save">Save</button><button class="btn" id="zip">Download ZIP</button>
</div>
<div class="work"><aside id="panel"></aside><div class="stage"><iframe id="frame" title="Live preview"></iframe></div></div>
<script src="editor.js"></script></body></html>
